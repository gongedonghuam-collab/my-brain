<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="google-site-verification"
      content="qpuJVeg2XkDd1ieycUl-LOQkD3MDEH7wVKmlPE3NdEI"
    />
    <link rel="icon" href="/logo.png?v=3" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Brain</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: white;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loader {
        margin-top: 32px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading-screen">
      <h1 style="font-size: 2rem; font-weight: 900">My Brain</h1>
      <p style="font-size: 0.8rem; opacity: 0.7">あなただけの第2の脳</p>
      <div class="loader"></div>
    </div>

    <script>
      // 5秒経っても画面が切り替わらなかったら、強制的に案内を表示する
      setTimeout(function () {
        var loader = document.getElementById("loading-screen");
        // ローディング画面がまだ存在し、かつ透明になっていない（アプリが起動していない）場合
        if (loader && window.getComputedStyle(loader).opacity !== "0") {
          loader.innerHTML = `
            <div style="text-align:center; padding:20px; color:white; max-width: 80%;">
              <div style="font-size: 50px; margin-bottom: 20px;">⚠️</div>
              <h1 style="font-size: 20px; margin-bottom: 10px;">ブラウザで開き直してください</h1>
              <p style="font-size: 14px; line-height: 1.6; opacity: 0.8;">
                TikTokやインスタのブラウザでは<br>
                Googleログインがブロックされるため、<br>
                アプリを起動できません。
              </p>
              <div style="margin-top: 30px; background: #3b82f6; padding: 15px; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 15px rgba(59,130,246,0.4);">
                右上の「・・・」から<br>
                「ブラウザで開く」を選択！
              </div>
            </div>
          `;
          // 念のためグルグル（loader）を止めるためのクラス削除などは不要（innerHTMLで上書きするため）
        }
      }, 5000);
    </script>
  </body>
</html>
