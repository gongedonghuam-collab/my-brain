<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/logo.png?v=3" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Brain</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        height: 100vh;
        width: 100vw;
        overflow-x: hidden;
        font-family: sans-serif;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: white;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loader {
        margin-top: 32px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading-screen">
      <h1 style="font-size: 2rem; font-weight: 900">My Brain</h1>
      <p style="font-size: 0.8rem; opacity: 0.7">あなただけの第2の脳</p>
      <div class="loader"></div>
    </div>

    <script>
      // 1. TikTok等のアプリ内ブラウザを強力に判定する
      var ua = navigator.userAgent.toLowerCase();
      var isInApp =
        /line|instagram|tiktok|bytedance|trill|musical_ly|fbav|fban|twitter/.test(
          ua,
        );

      if (isInApp) {
        // ★アプリ内ブラウザの場合：グローバルフラグを立てる
        window.__IN_APP_BROWSER__ = true;

        // 画面を即座に「ブラウザで開いてね」案内に書き換える
        document.getElementById("loading-screen").innerHTML = `
          <div style="background:#0f172a; color:white; height:100vh; width:100vw; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; text-align:center; box-sizing: border-box;">
            <div style="font-size:60px; margin-bottom:20px; animation: bounce 2s infinite;">↗️</div>
            <h1 style="font-size:22px; margin-bottom:10px; font-weight:bold;">右上のメニューから<br>ブラウザで開いてね！</h1>
            <p style="font-size:13px; opacity:0.8; margin-bottom:30px; line-height:1.6;">
              TikTokなどのアプリ内では<br>セキュリティ制限により起動できません💦
            </p>
            <div style="background:#4f46e5; padding:20px; border-radius:16px; font-weight:bold; box-shadow: 0 10px 25px rgba(79,70,229,0.4); text-align:left; font-size: 14px; width: 100%; max-width: 300px;">
              <div style="margin-bottom:12px;">① 右上の <span style="font-size:20px; margin: 0 5px;">⋯</span> または矢印をタップ</div>
              <div style="margin-bottom:12px;">②「ブラウザで開く」を選択</div>
              <div>③ Safariなどで自動起動します！</div>
            </div>
          </div>
        `;
      } else {
        // ★普通のブラウザの場合のみ、5秒後にローダーを消す保険タイマーを動かす
        setTimeout(function () {
          var loader = document.getElementById("loading-screen");
          if (loader && window.getComputedStyle(loader).opacity !== "0") {
            loader.style.opacity = "0";
            setTimeout(function () {
              loader.remove();
            }, 500);
          }
        }, 5000);
      }
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
